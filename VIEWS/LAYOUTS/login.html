<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Bellon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/login.css">
</head>
<body>

    <div class="container-fluid p-0">
        <div class="row g-0 min-vh-100 flex-column flex-md-row">
            
            <div class="col-12 col-md-6 d-flex align-items-center justify-content-center right-side-bg py-5 order-1 order-md-2">
                <div class="text-end p-3 container-logo-responsive">
                    <div class="bg-white p-4 rounded-4 shadow-lg mb-2 container-img-white">
                        <img src="/public/img/logo.png" alt="Bellon" class="img-fluid">
                    </div>
                    <p class="fst-italic text-white fw-medium slogan-text">
                        Encuentras más de lo que buscas
                    </p>
                </div>
            </div>

            <div class="col-12 col-md-6 d-flex flex-column justify-content-center align-items-center p-4 p-md-5 bg-white order-2 order-md-1">
                <div class="form-wrapper">
                    <h2 class="text-center fw-bold mb-4 form-title-custom">LOGIN</h2>
                    
                    <form action="/login" method="POST">
                        <div class="mb-3">
                            <input type="text" class="form-control rounded-pill p-3 custom-input" placeholder="Nombre" name="nombre">
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control rounded-pill p-3 custom-input" placeholder="Contraseña" name="password">
                        </div>
                        
                        <button type="submit" class="btn w-100 rounded-pill py-3 fw-bold text-white shadow btn-login-custom">
                            Login Now
                        </button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <a href="./register.html" class="footer-link-bellon text-decoration-none small fw-medium">
                            ¿No tienes cuenta? Pulsa aquí
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
