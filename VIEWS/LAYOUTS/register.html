<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Bellon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/register.css">
</head>
<body>

    <div class="container-fluid p-0">
        <div class="row g-0 min-vh-100 flex-column flex-md-row">
            
            <div class="col-12 col-md-6 d-flex align-items-center justify-content-center right-side-bg py-5 order-1 order-md-2">
                <div class="text-end p-3 container-logo-responsive">
                    <div class="bg-white p-4 rounded-4 shadow-lg mb-2 container-img-white">
                        <img src="/public/img/logo.png" alt="Bellon Logo" class="img-fluid">
                    </div>
                    <p class="fst-italic text-white fw-medium slogan-text">
                        Encuentras más de lo que buscas
                    </p>
                </div>
            </div>

            <div class="col-12 col-md-6 d-flex flex-column justify-content-center align-items-center p-4 p-md-5 bg-white order-2 order-md-1">
                <div class="form-wrapper">
                    <h2 class="text-center fw-bold mb-4 form-title-custom">REGISTER</h2>
                    
                    <form action="/register" method="POST">
                        <div class="mb-3">
                            <input type="text" class="form-control rounded-pill p-3 custom-input" placeholder="Nombre" name="nombre" required>
                        </div>
                        <div class="mb-3">
                            <input type="text" class="form-control rounded-pill p-3 custom-input" placeholder="Teléfono" name="telefono" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control rounded-pill p-3 custom-input" placeholder="Correo" name="correo" required>
                        </div>

                        <div class="mb-3 position-relative container-password">
                            <input type="password" id="password" class="form-control rounded-pill p-3 custom-input input-password-clean" 
                                   placeholder="Contraseña (mín. 8 caracteres)" name="password" 
                                   minlength="8" required>
                            <button type="button" id="togglePassword" class="btn-toggle-eye">
                                <span class="material-icons" id="eyeIcon">visibility_off</span>
                            </button>
                        </div>

                        <div class="mb-3">
                            <select class="form-select rounded-pill p-3 custom-input" name="direccion" required>
                                <option value="" disabled selected>dirección</option>
                                <option value="bani">Bani</option>
                                <option value="la-romana">La Romana</option>
                                <option value="mao">Mao</option>
                                <option value="punta-cana">Punta Cana</option>
                                <optgroup label="Santiago">
                                    <option value="bartolome-colon">Bartolome Colon</option>
                                    <option value="espana">España</option>
                                    <option value="imbert">Imbert</option>
                                    <option value="pontezuela">Pontezuela</option>
                                </optgroup>
                                <option value="san-francisco">San Francisco de Macorís</option>
                                <option value="santo-domingo-oeste">Santo Domingo Oeste</option>
                            </select>
                        </div>
                        
                        <button type="submit" class="btn w-100 rounded-pill py-3 fw-bold text-white shadow btn-register-custom">
                            Register now
                        </button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <a href="./login.html" class="text-info text-decoration-none small fw-medium">¿Tiene una cuenta? Pulse aquí</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');
        const eyeIcon = document.querySelector('#eyeIcon');

        togglePassword.addEventListener('click', function () {
            // 1. Cambiar el tipo de input (password <-> text)
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // 2. Cambiar el icono de Google dinámicamente
            // Si está en tipo 'password' (oculto), mostramos el ojo CERRADO (visibility_off)
            // Si está en tipo 'text' (visible), mostramos el ojo ABIERTO (visibility)
            eyeIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
        });
    </script>
</body>
</html>
