<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Bellon</title>
    <link rel="stylesheet" href="/public/css/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="main-container">
        <div class="card">
            <div class="left-side">
                <h2>LOGIN</h2>
                    <div class="input">
                    <div class="input-box1">
                    <input type="text" placeholder="nombre">
                     </div>
                    <div class="input-box2">
                    <input type="password" placeholder="contraseña">
                    </div>
                    </div>
                <button class="login-btn">Login Now</button>
                <a href="#" class="footer-link">¿No tienes cuenta? Pulsa aquí</a>
            </div>
            <div class="right-side">
                <div class="logo-container">
                    <img src="/public/img/logo.png" alt="Bellon">
                    <p class="slogan">Encuentras más de lo que buscas</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
